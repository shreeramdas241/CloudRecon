name: Scheduled synthetic assessment

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the synthetic assessment
        run: python -m cloudrecon.cli demo --reset --report examples/reports/scheduled-demo.html
      - name: Upload the synthetic report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-assessment
          path: examples/reports/scheduled-demo.html
