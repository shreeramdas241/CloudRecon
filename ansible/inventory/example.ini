# Example inventory only. Do not put production hosts or private keys in this file.
# SSH remains opt-in. SSM is the preferred path and is configured per host below.

[cloudrecon]
# web-1 ansible_host=10.0.1.10 ansible_user=ubuntu

[cloudrecon:vars]
# ansible_ssh_private_key_file is intentionally unset.
