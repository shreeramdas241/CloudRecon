---
# Read-only host discovery. The script is copied from this repo and executed as-is.
# It does not receive instance tags or free-form shell input.
- name: CloudRecon read-only host discovery
  hosts: cloudrecon
  become: false
  gather_facts: false
  vars:
    cloudrecon_output_dir: "{{ playbook_dir }}/../../examples/hosts"
  tasks:
    - name: Run the static collector
      ansible.builtin.script: "{{ playbook_dir }}/../../scripts/collect_host.sh"
      register: cloudrecon_discovery
      changed_when: false

    - name: Store the JSON result on the operator host
      ansible.builtin.copy:
        content: "{{ cloudrecon_discovery.stdout }}"
        dest: >-
          {{ cloudrecon_output_dir }}/{{
            inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_')
          }}.json
        mode: "0600"
      delegate_to: localhost
      become: false
